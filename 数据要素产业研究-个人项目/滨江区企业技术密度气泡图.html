        // 百度坐标转GCJ02（高德使用GCJ02）
        function bd09ToGcj02(lng, lat) {
            var X_PI = Math.PI * 3000.0 / 180.0;
            var x = lng - 0.0065;
            var y = lat - 0.006;
            var z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * X_PI);
            var theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * X_PI);
            var lng_gcj = z * Math.cos(theta);
            var lat_gcj = z * Math.sin(theta);
            return [lng_gcj, lat_gcj];
        }
        
        // 统计技术密度分布
        var densityStats = {
            min: Infinity,
            max: -Infinity,
            total: 0,
            count: 0
        };
        
        // 添加气泡标记
        companies.forEach(function(company) {
            if (company.lng && company.lat) {
                var coords = bd09ToGcj02(company.lng, company.lat);
                var density = company.tech_density || 0;
                
                // 统计
                if (density > 0) {
                    densityStats.min = Math.min(densityStats.min, density);
                    densityStats.max = Math.max(densityStats.max, density);
                    densityStats.total += density;
                    densityStats.count += 1;
                }
                
                var color = getTechDensityColor(density);
                var radius = getTechDensityRadius(density);
                
                // 创建圆形气泡
                var circle = L.circleMarker([coords[1], coords[0]], {
                    radius: radius,
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.7
                }).addTo(map);
                
                // 鼠标悬停效果
                circle.on('mouseover', function() {
                    this.setStyle({
                        fillOpacity: 0.9,
                        weight: 3
                    });
                });
                
                circle.on('mouseout', function() {
                    this.setStyle({
                        fillOpacity: 0.7,
                        weight: 2
                    });
                });
                
                // 获取技术密度等级描述
                var densityLevel = '';
                var densityColor = color;
                if (density >= 2.0) densityLevel = '极高';
                else if (density >= 1.0) densityLevel = '高';
                else if (density >= 0.5) densityLevel = '中等';
                else if (density >= 0.1) densityLevel = '较低';
                else densityLevel = '低';
                
                // 企业规模名称
                var sizeMap = {
                    'L': '大型',
                    'M': '中型',
                    'S': '小型',
                    'XS': '微型'
                };
                var sizeName = sizeMap[company.size.trim()] || company.size || '未知';
                
                // 弹出窗口内容
                var popupContent = 
                    '<div class="info-title">' + company.name + '</div>' +
                    '<div class="info-row"><span class="info-label">技术密度: </span>' +
                    '<span class="tech-density-highlight" style="background:' + densityColor + '">' + 
                    density.toFixed(3) + ' (' + densityLevel + ')</span></div>' +
                    '<div class="info-row"><span class="info-label">规模: </span>' +
                    '<span class="info-value">' + sizeName + '</span></div>' +
                    '<div class="info-row"><span class="info-label">地址: </span>' +
                    '<span class="info-value">' + (company.address || '-') + '</span></div>' +
                    '<div class="info-row"><span class="info-label">注册资本: </span>' +
                    '<span class="info-value">' + company.capital.toLocaleString() + ' 万元</span></div>' +
                    '<div class="info-row"><span class="info-label">参保人数: </span>' +
                    '<span class="info-value">' + company.employees + ' 人</span></div>' +
                    '<div class="info-row"><span class="info-label">高新企业: </span>' +
                    (company.hightech === '是' ? '<span class="badge badge-hightech">✓ 是</span>' : '否') + '</div>' +
                    '<div class="info-row"><span class="info-label">知识产权总数: </span>' +
                    '<span class="info-value">' + company.ip_total + ' 个</span></div>' +
                    '<div class="info-row"><span class="info-label">专利: </span>' +
                    '<span class="info-value">' + company.patents + ' 个</span></div>' +
                    '<div class="info-row"><span class="info-label">软著: </span>' +
                    '<span class="info-value">' + company.software + ' 个</span></div>' +
                    '<div class="info-row"><span class="info-label">对外投资: </span>' +
                    '<span class="info-value">' + company.investment + ' 家</span></div>' +
                    '<div class="info-row"><span class="info-label">成立: </span>' +
                    '<span class="info-value">' + company.year + ' 年（' + company.age + '年）</span></div>' +
                    (company.financing && company.financing !== 'nan' ? '<div class="info-row"><span class="info-label">融资: </span>' +
                    '<span class="info-value">' + company.financing + '</span></div>' : '');
                
                circle.bindPopup(popupContent);
            }
        });
        
        // 输出统计信息
        console.log('技术密度统计:');
        console.log('  最小值:', densityStats.min.toFixed(3));
        console.log('  最大值:', densityStats.max.toFixed(3));
